name: Android CI Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_REPO_PATH: builds/app-debug.apk

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No debug APK was found."
            exit 1
          fi
          echo "APK=$APK"
          mkdir -p builds
          cp "$APK" "$APK_REPO_PATH"
          ls -lh "$APK_REPO_PATH"

      - name: Save APK into repository
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_REPO_PATH"

          if git diff --cached --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi

          git commit -m "build: update debug APK"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: builds/app-debug.apk
          if-no-files-found: error
          retention-days: 7
