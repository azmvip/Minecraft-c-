name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify fixed Android toolchain
        run: |
          echo "Expected: AGP 8.7.3 + Gradle 8.9 + JDK 17 + compileSdk 35"
          grep -n '^agp = ' gradle/libs.versions.toml
          grep -n 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          grep -n 'compileSdk\|targetSdk' app/build.gradle.kts
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: purestream-audio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
